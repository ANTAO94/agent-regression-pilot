name: Consumer Agent regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install released Agent Regression Kit
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify v4.35 public evidence and readiness API
        run: >-
          python -c
          'from agent_regression import __version__, sha256_file;
          assert __version__ == "4.35.0";
          print(__version__, sha256_file("baselines/order-status.trace.json"))'
      - name: Verify v4.35 evidence bindings with an independent consumer bundle
        run: |
          PYTHONPATH=. python scripts/create_study.py --out-dir work/consumer-study
          agent-regression study \
            --manifest work/consumer-study/study.json \
            --format json \
            --out work/reports/consumer-study.json \
            --checksum-out work/reports/consumer-study.json.sha256
      - name: Verify the published report sidecar
        run: |
          shasum -a 256 work/reports/consumer-study.json
          test "$(awk '{print $1}' work/reports/consumer-study.json.sha256)" = "$(shasum -a 256 work/reports/consumer-study.json | awk '{print $1}')"
      - name: Verify readiness keeps independent evidence pending
        shell: bash
        run: |
          PYTHONPATH=. python scripts/create_readiness.py --out-dir work/consumer-readiness
          set +e
          agent-regression readiness \
            --manifest work/consumer-readiness/readiness.json \
            --out work/reports/consumer-readiness.json
          status=$?
          set -e
          test "$status" -eq 1
          python -c 'import json; value=json.load(open("work/reports/consumer-readiness.json")); assert value["ready"] is False; assert value["summary"]["pending"] == 1'
      - name: Record the normal Agent run
        run: PYTHONPATH=. python scripts/record_agent.py --variant normal --out work/candidate.trace.json
      - name: Validate the evidence boundary
        run: agent-regression check --config contracts/order-status.json
      - name: Compare the normal run
        run: agent-regression compare --config contracts/order-status.json
      - name: Inject wrong resource regression and require a block
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/record_agent.py --variant wrong-resource --out work/wrong-resource.trace.json
          cp work/wrong-resource.trace.json work/candidate.trace.json
          agent-regression compare --config contracts/order-status.json --out work/reports/wrong-resource.json
          status=$?
          test "$status" -eq 1
      - name: Inject skipped-tool regression and require a block
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/record_agent.py --variant skip-tool --out work/skip-tool.trace.json
          cp work/skip-tool.trace.json work/candidate.trace.json
          agent-regression compare --config contracts/order-status.json --out work/reports/skip-tool.json
          status=$?
          test "$status" -eq 1
      - name: Inject result-misread regression and require a block
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/record_agent.py --variant misread-result --out work/misread-result.trace.json
          cp work/misread-result.trace.json work/candidate.trace.json
          agent-regression compare --config contracts/order-status.json --out work/reports/misread-result.json
          status=$?
          test "$status" -eq 1
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-agent-regression-reports
          path: work/reports/
          if-no-files-found: error
